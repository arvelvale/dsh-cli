# Include from nginx's http context. Replace the hostname and TLS paths.
map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    '' close;
}

log_format dsh_access '$remote_addr $request_method $uri $status $request_time';

server {
    listen 443 ssl;
    server_name dsh.example.com;

    ssl_certificate /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/dsh-access.log dsh_access;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dsh_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 75s;

    location / {
        return 404;
    }

    location = /api/session/uploadFileBinary {
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3080;
    }

    location ~ "^/api/(remote\.mux|daemon\.files|changes\.(summary|diff)|credentials/(describe|set)|session/(list|create|prompt|events|cancel|modelCatalog|selectModel)|\x24events/result)$" {
        proxy_pass http://127.0.0.1:3080;
    }
}
